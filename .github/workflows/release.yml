name: release

on:
  push:
    tags:
      - "v[0-9]+*"
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6
      - name: Configure RubyGems credentials (OIDC trusted publishing, only for tags)
        if: startsWith(github.ref, 'refs/tags')
        uses: rubygems/configure-rubygems-credentials@c6ca7f4bac0e29c9bde8eeae0a0a986b27efa05f  # v2.2.0

      - name: Install build system
        run: .ci/scripts/install-build-system.sh

      - name: rake release (only for tags)
        run: rake release
        if: startsWith(github.ref, 'refs/tags')

      - name: rake build
        run: rake build
        if:  ${{ ! startsWith(github.ref, 'refs/tags') }}

      - name: generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: "${{ github.workspace }}/pkg/*.gem" 
      
  github-release:
    needs:
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release (only for tags)
        if: startsWith(github.ref, 'refs/tags')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --latest
          fi

  update-branch:
    needs:
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6
      - name: Setup Git
        uses: elastic/oblt-actions/git/setup@v1
      - name: Install build system
        run: .ci/scripts/install-build-system.sh
      - name: rake release:update_branch (only for tags)
        run: rake release:update_branch
        if: startsWith(github.ref, 'refs/tags')

  status:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - release
      - github-release
      - update-branch
    steps:
      - id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}
      - run: ${{ steps.check.outputs.is-success }}
      - if: ${{ always() && startsWith(github.ref, 'refs/tags') }}
        uses: elastic/oblt-actions/slack/notify-result@v1
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: "#apm-agent-ruby"
          message: ":traffic_cone: updatecli failed for `${{ github.repository }}@${{ github.ref_name }}`, @robots-ci please look what's going on <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|here>"
